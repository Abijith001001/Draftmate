
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DraftMate — 2D Drawing Test</title>
<style>
  body {
    margin: 0;
    padding: 18px;
    background: #f3f6fc;
    color: #18243b;
    font-family: Arial, sans-serif;
  }
  h1 { font-size: 25px; }
  .note { color: #68758b; line-height: 1.5; }
  .panel {
    background: white;
    border: 1px solid #dce3ef;
    border-radius: 12px;
    padding: 12px;
    margin: 16px 0;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
  }
  button, select {
    padding: 11px;
    margin: 5px 5px 5px 0;
    border: 1px solid #cbd5e5;
    border-radius: 8px;
    background: white;
    font-size: 15px;
  }
  #status {
    padding: 12px;
    background: #e8f8ef;
    border-radius: 8px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>

<h1>DraftMate 2D Drawing Test</h1>
<p class="note">
  Experimental projection drawings generated from the
  DraftMate geometry engine. This page does not change
  the main website.
</p>

<label for="solid">Choose a solid:</label>
<select id="solid">
  <option value="prism">Hexagonal Prism</option>
  <option value="pyramid">Square Pyramid</option>
  <option value="cylinder">Cylinder</option>
  <option value="cone">Cone</option>
</select>
<button id="draw">Draw FV + TV</button>

<div class="panel">
  <h2>Front View (FV)</h2>
  <canvas id="fv" width="700" height="300"></canvas>
</div>

<div class="panel">
  <h2>XY Reference Line</h2>
  <p class="note">
    XY separates the front-view and top-view regions.
  </p>
  <canvas id="xy" width="700" height="65"></canvas>
</div>

<div class="panel">
  <h2>Top View (TV)</h2>
  <canvas id="tv" width="700" height="300"></canvas>
</div>

<p id="status">Loading geometry engine...</p>

<script src="solids-engine.js"></script>
<script src="projection-engine.js"></script>

<script>
(function () {
  const status = document.getElementById("status");

  function drawLine(ctx, a, b) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function render(canvasId, vertices, edges, axisA, axisB) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    const values = vertices.map(v => ({
      x: Number(v.x),
      y: Number(v[axisA]),
      z: Number(v[axisB])
    }));

    if (!values.length ||
        values.some(p =>
          !Number.isFinite(p.x) ||
          !Number.isFinite(p.y) ||
          !Number.isFinite(p.z))) {
      throw new Error("Vertex coordinates are missing or invalid.");
    }

    const minX = Math.min(...values.map(p => p.x));
    const maxX = Math.max(...values.map(p => p.x));
    const minY = Math.min(...values.map(p => p.y));
    const maxY = Math.max(...values.map(p => p.y));

    const rangeX = Math.max(maxX - minX, 1);
    const rangeY = Math.max(maxY - minY, 1);
    const scale = Math.min(
      (W - 100) / rangeX,
      (H - 70) / rangeY
    );

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;

    const points = values.map(p => ({
      x: W / 2 + (p.x - cx) * scale,
      y: H / 2 - (p.y - cy) * scale
    }));

    ctx.strokeStyle = "#4058c8";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    edges.forEach(edge => {
      const a = Array.isArray(edge) ? edge[0] :
        (edge.a ?? edge.from ?? edge.start);
      const b = Array.isArray(edge) ? edge[1] :
        (edge.b ?? edge.to ?? edge.end);

      if (Number.isInteger(a) && Number.isInteger(b) &&
          points[a] && points[b]) {
        drawLine(ctx, points[a], points[b]);
      } else if (typeof a === "string" &&
                 typeof b === "string") {
        const ia = vertices.findIndex(v => v.id === a);
        const ib = vertices.findIndex(v => v.id === b);
        if (ia >= 0 && ib >= 0) {
          drawLine(ctx, points[ia], points[ib]);
        }
      }
    });

    ctx.fillStyle = "#4058c8";
    points.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    return points.length;
  }

  function draw() {
    try {
      if (!window.DraftMateSolids ||
          !window.DraftMateProjection) {
        throw new Error(
          "Could not load an engine file. Check filenames and script paths."
        );
      }

      const type = document.getElementById("solid").value;

      const model = window.DraftMateSolids.createSolid(type, {
        sides: type === "prism" ? 6 : 4,
        radius: 25,
        height: 60,
        segments: 32
      });

      if (!model || !Array.isArray(model.vertices) ||
          !Array.isArray(model.edges)) {
        throw new Error(
          "Unexpected model format. We need to match the engine's vertex and edge structure."
        );
      }

      // Verify that the projection engine also accepts this model.
      const projection =
        window.DraftMateProjection.createProjection(model);

      if (!projection) {
        throw new Error("Projection engine returned no result.");
      }

      // FV uses X and Z. TV uses X and Y.
      const fvCount = render(
        "fv", model.vertices, model.edges, "x", "z"
      );

      const tvCount = render(
        "tv", model.vertices, model.edges, "x", "y"
      );

      const xy = document.getElementById("xy");
      const ctx = xy.getContext("2d");
      ctx.clearRect(0, 0, xy.width, xy.height);
      ctx.strokeStyle = "#7d8aa3";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(25, 32);
      ctx.lineTo(xy.width - 25, 32);
      ctx.stroke();
      ctx.fillStyle = "#65738b";
      ctx.font = "bold 13px Arial";
      ctx.fillText("X", 12, 24);
      ctx.fillText("Y", xy.width - 20, 24);

      status.textContent =
        "PASS: Drawing generated. Vertices: " +
        model.vertices.length +
        ". Edges: " + model.edges.length +
        ". FV points: " + fvCount +
        ". TV points: " + tvCount +
        ". Hidden-line classification and engineering inclinations are not implemented yet.";

    } catch (error) {
      status.textContent = "ERROR: " + error.message;
      console.error(error);
    }
  }

  document.getElementById("draw").addEventListener("click", draw);
  draw();
})();
</script>

</body>
</html>
